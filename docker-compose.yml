services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zukunftstag
      POSTGRES_USER: zukunftstag
      POSTGRES_PASSWORD: zukunftstag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zukunftstag -d zukunftstag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    environment:
      PORT: "4200"
      DATABASE_URL: postgres://zukunftstag:zukunftstag@db:5432/zukunftstag
      HOST_PASSWORD: Roche26
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./app
          ignore:
            - node_modules/
            - dist/
            - .angular/

volumes:
  postgres_data:
