services:
  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zukunftstag}
      POSTGRES_USER: ${POSTGRES_USER:-zukunftstag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zukunftstag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    expose:
      - "80"
    ports:
      - "${APP_PORT:-4200}:80"
    environment:
      NODE_ENV: production
      PORT: "80"
      SERVICE_URL_APP_80: /
      HOST_PASSWORD: ${HOST_PASSWORD:-Roche26}
      POSTGRES_DB: ${POSTGRES_DB:-zukunftstag}
      POSTGRES_USER: ${POSTGRES_USER:-zukunftstag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zukunftstag}
      DATABASE_URL: postgres://${POSTGRES_USER:-zukunftstag}:${POSTGRES_PASSWORD:-zukunftstag}@db:5432/${POSTGRES_DB:-zukunftstag}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||80)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./app
          ignore:
            - node_modules/
            - dist/
            - .angular/

volumes:
  postgres_data:
