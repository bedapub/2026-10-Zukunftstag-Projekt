services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zukunftstag}
      POSTGRES_USER: ${POSTGRES_USER:-zukunftstag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zukunftstag}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zukunftstag} -d ${POSTGRES_DB:-zukunftstag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "80:80"
    expose:
      - "80"
    environment:
      PORT: "80"
      DATABASE_URL: ${DATABASE_URL:-postgres://zukunftstag:zukunftstag@db:5432/zukunftstag}
      HOST_PASSWORD: ${HOST_PASSWORD:-Roche26}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:80/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./app
          ignore:
            - node_modules/
            - dist/
            - .angular/

volumes:
  postgres_data:
